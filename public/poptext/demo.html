<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PopText 效果演示 — 打字弹入 + 鼠标划过气球变形</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pop-text.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse 60% 80% at 22% 45%, rgba(122,26,38,.55) 0%, rgba(122,26,38,0) 60%),
      radial-gradient(ellipse 50% 65% at 78% 30%, rgba(140,90,40,.35) 0%, rgba(140,90,40,0) 65%),
      radial-gradient(ellipse 90% 90% at 50% 60%, #2b170a 0%, #1a0e06 55%, #100903 100%);
    overflow:hidden;
  }
  .stage{transform:translateY(-6vh);text-align:left;padding:0 6vw;width:100%}
  .pop-text{
    color:#fff;
    font-size:clamp(44px,6.2vw,72px);
    line-height:1.4;
    text-shadow:0 4px 30px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  }
  .hint{
    margin-top:4vh;color:rgba(255,255,255,.32);font-size:12px;letter-spacing:2px;
    text-align:center;
  }
  /* 任意文字输入条 */
  .input-bar{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    background:rgba(20,14,10,.72);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:999px;padding:7px 8px 7px 14px;
    box-shadow:0 10px 34px rgba(0,0,0,.32);
  }
  .input-bar:focus-within{border-color:rgba(255,146,175,.55)}
  .input-bar .ico{font-size:15px}
  .input-bar input{
    width:min(46vw,360px);
    background:transparent;border:none;outline:none;
    color:#fff;font-size:13px;letter-spacing:.5px;
  }
  .input-bar input::placeholder{color:rgba(255,255,255,.35)}
  .input-bar button{
    flex:none;cursor:pointer;
    border:none;border-radius:999px;
    padding:7px 16px;font-size:13px;
    color:#fff;background:rgba(244,63,94,.92);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .input-bar button:hover{filter:brightness(1.08);transform:translateY(-1px)}
</style>
</head>
<body>
  <div class="stage">
    <h1 class="pop-text" id="line1" data-text="Welcome"></h1>
    <h1 class="pop-text" id="line2" data-text="to threetwoa’s blog" data-delay="750"></h1>
    <p class="hint">打完把鼠标划过字母,字母会充气成糖果气球版自己 ✦ 换任意文字:输入后回车</p>
  </div>

  <div class="input-bar">
    <span class="ico">✍️</span>
    <input id="ptInput" type="text" maxlength="48" placeholder="输入任意字母 / 文字…">
    <button id="ptReplay">变形重放 ↵</button>
  </div>

  <script src="pop-text.js"></script>
  <script>
  (function(){
    var input  = document.getElementById('ptInput');
    var button = document.getElementById('ptReplay');
    var line1  = document.getElementById('line1');
    var line2  = document.getElementById('line2');
    var DEFAULT = ["Welcome", "to threetwoa\u2019s blog"];

    function play(text){
      text = (text || '').trim();
      line1.removeAttribute('data-text');
      line2.removeAttribute('data-text');
      line1.innerHTML = ''; line2.innerHTML = '';
      if (!text){ /* 空输入:恢复默认两行 */
        line1.style.fontSize = '';
        line2.style.fontSize = '';
        PopText.type(line1, DEFAULT[0], {});
        PopText.type(line2, DEFAULT[1], {startDelay: 750});
        return;
      }
      /* 单行显示输入的任意文字,按长度自适应字号 */
      var n = PopText.splitGraphemes(text).length;
      line1.style.fontSize = 'min(72px, max(30px, ' + Math.floor(760 / Math.max(n,1)) + 'px))';
      PopText.type(line1, text, {});
    }

    function submit(){ play(input.value); }
    button.addEventListener('click', submit);
    button.addEventListener('pointerup', submit);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') submit();
    });
    var debounce = null;
    input.addEventListener('input', function(){
      clearTimeout(debounce);
      debounce = setTimeout(submit, 600);
    });
  })();
  </script>
</body>
</html>
