name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # v17：npm ci 尊重 lockfile（npm install 会漂移）；lint 入门禁（同批把 19 个存量 error 清零）；
      # build 验证可构建性——此前只有 Vercel 侧兜底（v8 白屏事故的教训）。
      - name: Install deps (lockfile-exact)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (errors block)
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-placeholder-not-secret
